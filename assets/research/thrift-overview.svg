    <text x="887" y="745" fill="#123b5a" font-size="42" font-weight="700">Selective teacher refresh instead of repeated transfer</text>
    <text x="887" y="797" fill="#7890a5" font-size="31">federated learning · communication accounting · WSN intrusion detection</text>
  </g>
</svg>